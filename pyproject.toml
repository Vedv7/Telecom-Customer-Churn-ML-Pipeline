[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telecom-churn"
version = "0.1.0"
description = "Telecom customer churn — library, training CLI, and FastAPI inference."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Veda Swaroop" }]
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "scikit-learn>=1.3,<2",
  "xgboost>=2.0,<4",
  "lightgbm>=4.0,<5",
  "openpyxl>=3.1,<4",
  "xlrd>=2.0,<3",
  "joblib>=1.3,<2",
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<1",
  "shap>=0.44,<1",
  "optuna>=3.5,<4",
  "imbalanced-learn>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4,<9", "ruff>=0.4,<1"]
api = ["fastapi>=0.110,<1", "uvicorn[standard]>=0.27,<1", "pydantic>=2.6,<3"]

[project.scripts]
churn-train = "telecom_churn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
